    // =========================================================================
    async function initDatabase() {
      const syncDot = document.getElementById("sync-dot");
      const syncText = document.getElementById("sync-text");

      try {
        if (!SUPABASE_KEY || SUPABASE_KEY.includes("貼上你複製的")) {
          syncDot.className = "w-2 h-2 rounded-full bg-amber-500";
          syncText.textContent = "尚未填入資料庫金鑰";
          return;
        }

        // 讀取目前雲端資料
        const { data, error } = await supabase
          .from("laws")
          .select("content")
          .eq("id", "main_v3")
          .single();

        if (error) throw error;

        if (data && data.content && Array.isArray(data.content.chapters)) {
          publishedData = data.content;
          if (!isEditMode) renderAll();
        }

        isSupabaseReady = true;
        syncDot.className = "w-2 h-2 rounded-full bg-emerald-500";
        syncText.textContent = "雲端即時同步中";
        updateFooterTime();

        // 監聽其他管理員的即時更新
        supabase
          .channel("laws-changes")
          .on(
            "postgres_changes",
            { event: "UPDATE", schema: "public", table: "laws", filter: "id=eq.main_v3" },
            (payload) => {
              if (payload.new && payload.new.content && Array.isArray(payload.new.content.chapters)) {
                publishedData = payload.new.content;
                if (!isEditMode) {
                  renderAll();
                  showToast("法規已同步至最新版本！");
                }
              }
            }
          )
          .subscribe();
      } catch (err) {
        console.error("Supabase init error:", err);
        syncDot.className = "w-2 h-2 rounded-full bg-rose-500";
        syncText.textContent = "連線失敗，請檢查金鑰或資料表";
      }
    }

    // =========================================================================
    // 4. 文字處理與高亮度標記工具
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeRegExp(str) {
      return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlightText(text, keyword) {
      const safe = escapeHtml(text);
      if (!keyword || !keyword.trim()) return safe;
      const regex = new RegExp(`(${escapeRegExp(keyword.trim())})`, "gi");
      return safe.replace(regex, '<mark class="bg-amber-200/95 text-slate-900 rounded px-0.5 font-semibold">$1</mark>');
    }

    function matchesArticle(chapter, article, keyword) {
      const q = keyword.trim().toLowerCase();
      if (!q) return true;
      if (q === "罰則" && article.penalties && article.penalties.length > 0) return true;

      const haystack = [
        chapter.number,
        chapter.title,
        article.number,
        article.title,
        ...(article.rules || []),
        ...(article.penalties || [])
      ].join(" ").toLowerCase();

      return haystack.includes(q);
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById("toast");
      const inner = document.getElementById("toast-inner");
      const text = document.getElementById("toast-message");
      text.textContent = msg;
      inner.className = `px-4 py-2.5 rounded-xl text-sm font-medium shadow-lg flex items-center gap-2 whitespace-nowrap ${
        isError ? "bg-[#BE123C] text-white" : "bg-slate-900 text-white"
      }`;
      toast.classList.remove("opacity-0", "translate-y-3");
      toast.classList.add("opacity-100", "translate-y-0");

      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-3");
        toast.classList.remove("opacity-100", "translate-y-0");
      }, 2600);
    }

                    </div>
                    <ul class="space-y-2 text-sm sm:text-[15px] text-slate-700 leading-relaxed">
                      ${art.rules.map((rule) => `<li class="pl-3 border-l-2 border-slate-200">${highlightText(rule, q)}</li>`).join("")}
                    </ul>
                  </div>
                  `
                    : ""
                }

                ${
                  hasPenalties
                    ? `
                  <div class="rounded-xl bg-[#FFF1F2] border border-[#FECDD3] p-4 space-y-2">
                    <div class="flex items-center gap-1.5 text-xs font-bold text-[#BE123C]">
                      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                      違規罰則／注意事項
                    </div>
                    <ul class="space-y-1.5 text-sm sm:text-[15px] text-rose-950 leading-relaxed">
                      ${art.penalties.map((p) => `<li class="flex items-start gap-2"><span class="text-[#BE123C] font-bold mt-0.5">•</span><span>${highlightText(p, q)}</span></li>`).join("")}
                    </ul>
                  </div>
                  `
                    : ""
                }
              </div>
            </article>
          `;
        }).join("");

        chaptersHtml.push(`
          <section id="${chAnchor}" class="space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b-2 border-slate-200">
              ${
                isEditMode
                  ? `
                <div class="flex flex-wrap items-center gap-2 flex-1">
                  <input type="text" data-action="edit-ch-num" data-ch="${chIdx}" value="${escapeHtml(chapter.number)}" class="w-24 px-2.5 py-1 rounded-lg border border-amber-300 bg-white text-sm font-bold text-[#B45309] focus:outline-none focus:ring-2 focus:ring-amber-500" />
                  <input type="text" data-action="edit-ch-title" data-ch="${chIdx}" value="${escapeHtml(chapter.title)}" class="flex-1 min-w-[160px] px-2.5 py-1 rounded-lg border border-amber-300 bg-white text-base font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500" />
                </div>
                <div class="flex items-center gap-1.5">
                  <button type="button" data-action="add-article" data-ch="${chIdx}" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-amber-600 hover:bg-amber-700 text-white transition">
                    + 新增條例
                  </button>
                  <button type="button" data-action="delete-chapter" data-ch="${chIdx}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-[#BE123C] border border-rose-200 transition">
                    刪除章節
                  </button>
                </div>
                `
                  : `
                <div class="flex items-center gap-2.5">
                  <span class="w-2 h-6 rounded-full bg-[#B45309]"></span>
                  <h2 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
                    <span class="text-[#B45309] mr-1.5">${highlightText(chapter.number, q)}</span>${highlightText(chapter.title, q)}
                  </h2>
                </div>
                <span class="text-xs font-medium text-slate-400">共 ${filteredArticles.length} 條</span>
                `
              }
            </div>
            <div class="space-y-4">
              ${articlesHtml || `<div class="text-sm text-slate-400 italic py-4 text-center bg-white rounded-xl border border-dashed border-slate-200">本章節尚無條例，請點擊「+ 新增條例」</div>`}
            </div>
          </section>
        `);
      });

      desktopLinks.push(`
        <a href="#appendix-section" class="block px-2.5 py-2 rounded-xl text-xs font-bold text-slate-700 hover:bg-amber-50 hover:text-[#B45309] transition border-t border-slate-100 mt-1 pt-2.5">
          附則與官員罰則
        </a>
      `);
      mobileLinks.push(`
        <a href="#appendix-section" class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-200/80 text-slate-800 hover:bg-amber-100 hover:text-[#B45309] transition">
          附則
        </a>
      `);

      desktopToc.innerHTML = desktopLinks.join("");
      mobileToc.innerHTML = mobileLinks.join("");
      chaptersContainer.innerHTML = chaptersHtml.join("");

      const appendixMatches = (data.appendix || []).filter((item) => !q || item.toLowerCase().includes(q.toLowerCase())).length;
      const totalWithAppendix = totalMatches + (q ? appendixMatches : 0);

      if (q && !isEditMode) {
        searchStatusBar.classList.remove("hidden");
        document.getElementById("search-keyword-display").textContent = q;
        document.getElementById("search-count-display").textContent = String(totalWithAppendix);
        emptyState.classList.toggle("hidden", totalWithAppendix > 0);
      } else {
        searchStatusBar.classList.add("hidden");
        emptyState.classList.add("hidden");
      }
    }

    function renderAppendix(data) {
      const container = document.getElementById("appendix-container");
      const q = searchQuery.trim();
      const items = data.appendix || [];

      if (isEditMode) {
        container.innerHTML = items.length
          ? items.map((item, idx) => `
              <div class="flex items-start gap-2">
                <textarea data-action="edit-appendix" data-idx="${idx}" rows="2" class="flex-1 px-3 py-2 rounded-xl border border-amber-300 bg-amber-50/20 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-amber-500">${escapeHtml(item)}</textarea>
                <button type="button" data-action="delete-appendix" data-idx="${idx}" class="px-2.5 py-2 rounded-xl text-xs font-semibold bg-rose-50 hover:bg-rose-100 text-[#BE123C] border border-rose-200 transition shrink-0">
                  刪除
                </button>
              </div>
            `).join("")
          : `<p class="text-sm text-slate-400 italic text-center py-2">尚無附則項目</p>`;
      } else {
        container.innerHTML = items.map((item) => `
          <div class="flex items-start gap-3 p-3 rounded-xl bg-slate-50 border border-slate-200/70 text-sm sm:text-[15px] text-slate-800 leading-relaxed">
            <span class="w-2 h-2 rounded-full bg-[#B45309] mt-2 shrink-0"></span>
            <div>${highlightText(item, q)}</div>
          </div>
        `).join("");
      }
    }

    // =========================================================================
    // 6. 一鍵複製純文字版
    // =========================================================================
    function generatePlainText(data) {
      const lines = [];
      lines.push(`【${data.title}】`);
      lines.push(`生效日期：${data.effectiveDate}`);
      lines.push(`（${data.notice}）`);
      lines.push(`適用地區：${data.meta.region}`);
      lines.push(`主責土地官：${data.meta.mainOfficer}`);
      lines.push(`代理土地官：${data.meta.actingOfficer}`);
      lines.push(`著作人：${data.meta.author}`);
      lines.push("--------------------------------");

      data.chapters.forEach((ch) => {
        lines.push(`\n${ch.number} ${ch.title}`);
        ch.articles.forEach((art) => {
          lines.push(`${art.number} ${art.title}`);
          (art.rules || []).forEach((r) => lines.push(`  ${r}`));
          if (art.penalties && art.penalties.length > 0) {
            lines.push(`  【違規罰則／注意事項】`);
            art.penalties.forEach((p) => lines.push(`  • ${p}`));
          }
        });
      });

      if (data.appendix && data.appendix.length > 0) {
        lines.push("\n【附則】");
        data.appendix.forEach((a) => lines.push(a));
      }
      return lines.join("\n");
    }

    function copyLawText() {
      const text = generatePlainText(getActiveData());
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      try {
        const ok = document.execCommand("copy");
        showToast(ok ? "已複製完整文字版法規，可直接貼上至群組！" : "複製失敗，請手動選取文字。", !ok);
      } catch (e) {
        showToast("複製失敗，請手動選取文字。", true);
      } finally {
        document.body.removeChild(textarea);
      }
    }

    // =========================================================================
    // 7. 管理員編輯與 Supabase 雲端發布邏輯
    // =========================================================================
    function enterEditMode() {
      draftData = deepClone(publishedData);
      isEditMode = true;
      searchQuery = "";
      activeQuickTag = "全部";
      document.getElementById("search-input").value = "";
      document.getElementById("btn-clear-search-icon").classList.add("hidden");
      renderAll();
      showToast("已解鎖管理員編輯模式");
    }

    function exitEditMode() {
      isEditMode = false;
      draftData = null;
      renderAll();
      showToast("已退出編輯並鎖定為唯讀模式");
    }

    async function saveAndPublish() {
      if (!isEditMode || !draftData) return;

      draftData.title = document.getElementById("input-title").value.trim() || "同盟土法 V3";
      draftData.effectiveDate = document.getElementById("input-effective-date").value.trim();
      draftData.notice = document.getElementById("input-notice").value.trim();
      draftData.meta.region = document.getElementById("input-region").value.trim();
      draftData.meta.mainOfficer = document.getElementById("input-main-officer").value.trim();
      draftData.meta.actingOfficer = document.getElementById("input-acting-officer").value.trim();
      draftData.meta.author = document.getElementById("input-author").value.trim();

      const now = new Date();
      draftData.updatedAt = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")} ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;

      const btnText = document.getElementById("save-btn-text");
      btnText.textContent = "發布中...";

      try {
        if (isSupabaseReady) {
          const { error } = await supabase
            .from("laws")
            .upsert({ id: "main_v3", content: draftData });

          if (error) throw error;
          publishedData = deepClone(draftData);
          showToast("已成功儲存並即時同步至所有成員！");
        } else {
          publishedData = deepClone(draftData);
          showToast("資料庫未連線，僅暫存於本機預覽", true);
        }
        renderAll();
      } catch (err) {
        console.error("Save error:", err);
        showToast("儲存失敗，請檢查網路連線後重試。", true);
      } finally {
        btnText.textContent = "儲存並發布";
      }
    }

    // =========================================================================
    // 8. 彈窗控制
    // =========================================================================
    function openPasswordModal() {
      const modal = document.getElementById("password-modal");
      const input = document.getElementById("password-input");
      const error = document.getElementById("password-error");
      input.value = "";
      error.classList.add("hidden");
      modal.classList.remove("hidden");
      setTimeout(() => input.focus(), 50);
    }

    function closePasswordModal() {
      document.getElementById("password-modal").classList.add("hidden");
    }

    function openArticleModal(chIdx, artIdx) {
      editingTarget = { chIdx, artIdx };
      const modal = document.getElementById("article-modal");
      const titleEl = document.getElementById("article-modal-title");
      const numInput = document.getElementById("art-input-number");
      const titleInput = document.getElementById("art-input-title");
      const rulesInput = document.getElementById("art-input-rules");
      const penaltiesInput = document.getElementById("art-input-penalties");

      if (artIdx === -1) {
        titleEl.textContent = "新增法規條例";
        numInput.value = "";
        titleInput.value = "";
        rulesInput.value = "";
        penaltiesInput.value = "";
      } else {
        const art = draftData.chapters[chIdx].articles[artIdx];
        titleEl.textContent = `編輯條例：${art.number} ${art.title}`;
        numInput.value = art.number || "";
        titleInput.value = art.title || "";
        rulesInput.value = (art.rules || []).join("\n");
        penaltiesInput.value = (art.penalties || []).join("\n");
      }

      modal.classList.remove("hidden");
      setTimeout(() => numInput.focus(), 50);
    }

    function closeArticleModal() {
      document.getElementById("article-modal").classList.add("hidden");
      editingTarget = null;
    }

    function openConfirmModal(title, message, onConfirm) {
      document.getElementById("confirm-modal-title").textContent = title;
      document.getElementById("confirm-modal-message").textContent = message;
      confirmCallback = onConfirm;
      document.getElementById("confirm-modal").classList.remove("hidden");
    }

    function closeConfirmModal() {
      document.getElementById("confirm-modal").classList.add("hidden");
      confirmCallback = null;
    }

    // =========================================================================
    // 9. 事件監聽綁定
    // =========================================================================
    function bindEvents() {
      const searchInput = document.getElementById("search-input");
      const clearIcon = document.getElementById("btn-clear-search-icon");

      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        activeQuickTag = QUICK_TAGS.includes(searchQuery.trim()) ? searchQuery.trim() : searchQuery.trim() === "" ? "全部" : "";
        clearIcon.classList.toggle("hidden", !searchQuery);
        renderQuickTags();
        renderChaptersAndToc(getActiveData());
        renderAppendix(getActiveData());
      });

      const resetSearch = () => {
        searchQuery = "";
        activeQuickTag = "全部";
        searchInput.value = "";
        clearIcon.classList.add("hidden");
        renderQuickTags();
        renderChaptersAndToc(getActiveData());
        renderAppendix(getActiveData());
      };

      clearIcon.addEventListener("click", resetSearch);
      document.getElementById("btn-clear-search").addEventListener("click", resetSearch);
      document.getElementById("btn-empty-reset").addEventListener("click", resetSearch);

      document.getElementById("quick-tags-container").addEventListener("click", (e) => {
        const btn = e.target.closest(".quick-tag-btn");
        if (!btn) return;
        const tag = btn.dataset.tag;
        activeQuickTag = tag;
        searchQuery = tag === "全部" ? "" : tag;
        searchInput.value = searchQuery;
        clearIcon.classList.toggle("hidden", !searchQuery);
        renderQuickTags();
        renderChaptersAndToc(getActiveData());
        renderAppendix(getActiveData());
      });

      document.getElementById("btn-copy-all").addEventListener("click", copyLawText);
      document.getElementById("btn-admin-unlock").addEventListener("click", openPasswordModal);
      document.getElementById("btn-close-pw-modal").addEventListener("click", closePasswordModal);
      document.getElementById("btn-cancel-pw").addEventListener("click", closePasswordModal);
      document.getElementById("password-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const val = document.getElementById("password-input").value.trim();
        if (val === ADMIN_PASSWORD) {
          closePasswordModal();
          enterEditMode();
        } else {
          document.getElementById("password-error").classList.remove("hidden");
        }
      });

      document.getElementById("btn-save-publish").addEventListener("click", saveAndPublish);
      document.getElementById("btn-exit-edit").addEventListener("click", exitEditMode);
      document.getElementById("btn-restore-default").addEventListener("click", () => {
        openConfirmModal(
          "還原預設條文",
          "確定要將所有章節、條例與基本資訊還原為「同盟土法 V3」原始預設內容嗎？（還原後需點擊「儲存並發布」才會同步至雲端）",
          () => {
            draftData = getDefaultLawData();
            renderAll();
            showToast("已還原為預設條文，請記得點擊「儲存並發布」");
          }
        );
      });

      document.getElementById("btn-add-chapter").addEventListener("click", () => {
        if (!draftData) return;
        const nextNum = draftData.chapters.length + 1;
        draftData.chapters.push({
          id: `ch-${Date.now()}`,
          number: `第${nextNum}章`,
          title: "新章節名稱",
          articles: []
        });
        renderChaptersAndToc(draftData);
        showToast("已新增章節");
      });

      const chaptersContainer = document.getElementById("chapters-container");
      chaptersContainer.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-action]");
        if (!btn || !draftData) return;
        const action = btn.dataset.action;
        const chIdx = Number(btn.dataset.ch);
        const artIdx = Number(btn.dataset.art);

        if (action === "add-article") {
          openArticleModal(chIdx, -1);
        } else if (action === "edit-article") {
          openArticleModal(chIdx, artIdx);
        } else if (action === "delete-article") {
          const art = draftData.chapters[chIdx].articles[artIdx];
          openConfirmModal("刪除條例", `確定要刪除「${art.number} ${art.title}」嗎？`, () => {
            draftData.chapters[chIdx].articles.splice(artIdx, 1);
            renderChaptersAndToc(draftData);
            showToast("已刪除條例");
          });
        } else if (action === "delete-chapter") {
          const ch = draftData.chapters[chIdx];
          openConfirmModal("刪除章節", `確定要刪除整個「${ch.number} ${ch.title}」及其下所有條例嗎？`, () => {
            draftData.chapters.splice(chIdx, 1);
            renderChaptersAndToc(draftData);
            showToast("已刪除章節");
          });
        }
      });

      chaptersContainer.addEventListener("input", (e) => {
        const input = e.target.closest("input[data-action]");
        if (!input || !draftData) return;
        const chIdx = Number(input.dataset.ch);
        if (input.dataset.action === "edit-ch-num") {
          draftData.chapters[chIdx].number = input.value;
        } else if (input.dataset.action === "edit-ch-title") {
          draftData.chapters[chIdx].title = input.value;
        }
      });

      document.getElementById("btn-close-article-modal").addEventListener("click", closeArticleModal);
      document.getElementById("btn-cancel-article").addEventListener("click", closeArticleModal);
      document.getElementById("article-form").addEventListener("submit", (e) => {
        e.preventDefault();
        if (!editingTarget || !draftData) return;
        const { chIdx, artIdx } = editingTarget;
        const newArt = {
          id: artIdx === -1 ? `art-${Date.now()}` : draftData.chapters[chIdx].articles[artIdx].id,
          number: document.getElementById("art-input-number").value.trim(),
          title: document.getElementById("art-input-title").value.trim(),
          rules: document.getElementById("art-input-rules").value.split("\n").map((s) => s.trim()).filter(Boolean),
          penalties: document.getElementById("art-input-penalties").value.split("\n").map((s) => s.trim()).filter(Boolean)
        };

        if (artIdx === -1) {
          draftData.chapters[chIdx].articles.push(newArt);
          showToast("已新增條例，請記得點擊「儲存並發布」");
        } else {
          draftData.chapters[chIdx].articles[artIdx] = newArt;
          showToast("已更新條例，請記得點擊「儲存並發布」");
        }
        closeArticleModal();
        renderChaptersAndToc(draftData);
      });

      document.getElementById("btn-add-appendix").addEventListener("click", () => {
        if (!draftData) return;
        const nextIdx = (draftData.appendix || []).length + 1;
        draftData.appendix.push(`${nextIdx}. 請輸入新的附則條文...`);
        renderAppendix(draftData);
      });

      const appendixContainer = document.getElementById("appendix-container");
      appendixContainer.addEventListener("input", (e) => {
        const ta = e.target.closest('textarea[data-action="edit-appendix"]');
        if (!ta || !draftData) return;
        draftData.appendix[Number(ta.dataset.idx)] = ta.value;
      });
      appendixContainer.addEventListener("click", (e) => {
        const btn = e.target.closest('button[data-action="delete-appendix"]');
        if (!btn || !draftData) return;
        draftData.appendix.splice(Number(btn.dataset.idx), 1);
        renderAppendix(draftData);
      });

      document.getElementById("btn-confirm-cancel").addEventListener("click", closeConfirmModal);
      document.getElementById("btn-confirm-ok").addEventListener("click", () => {
        if (typeof confirmCallback === "function") confirmCallback();
        closeConfirmModal();
      });
    }

    // =========================================================================
    // 10. 啟動應用程式
    // =========================================================================
    bindEvents();
    renderAll();
    initDatabase();
  </script>
</body>
</html>
